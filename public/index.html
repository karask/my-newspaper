<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#161310">
    <meta
      name="description"
      content="A personal newswire for consequential developments in Bitcoin, AI, robotics, and longevity."
    >
    <title>The Daily Signal — Personal Intelligence</title>
    <link rel="stylesheet" href="./styles.css">
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("daily-signal-theme");
          document.documentElement.dataset.theme = saved || "dark";
        } catch (_) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to the edition</a>

    <header class="masthead">
      <div class="desk-bar page-width">
        <div class="identity">
          <span class="status-pip" aria-hidden="true"></span>
          <p class="prompt-label">SIGNAL(1)</p>
          <h1>The Daily Signal</h1>
        </div>
        <p class="identity-path">bitcoin / ai / robotics / longevity</p>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme">
          <span aria-hidden="true" class="theme-mark">▣</span>
          <span id="theme-label">light</span>
        </button>
      </div>

      <div class="edition-line page-width" id="edition-meta" aria-live="polite">
        <span>Loading today’s edition…</span>
      </div>

      <div class="desk-controls page-width">
        <div class="archive-control">
          <label for="edition-select">archive</label>
          <select id="edition-select" aria-label="Choose a newspaper edition">
            <option value="./data/news.json">Current edition</option>
          </select>
        </div>
        <nav class="topic-nav" aria-label="Filter the edition by topic">
          <div class="topic-filters" id="topic-filters"></div>
        </nav>
      </div>
    </header>

    <main class="page-width" id="main-content" tabindex="-1">
      <div class="page-status" id="page-status" role="status" aria-live="polite">
        Opening the edition…
      </div>

      <section class="front-page" aria-label="Today’s briefing">
        <section class="explore" aria-labelledby="explore-heading">
          <div class="section-rule">
            <h2 id="explore-heading">Explore</h2>
            <p>lead</p>
          </div>
          <div id="lead-story" aria-busy="true"></div>
        </section>

        <aside class="monitor" aria-labelledby="monitor-heading">
          <div class="section-rule section-rule--monitor">
            <h2 id="monitor-heading">Monitor</h2>
            <p>stream</p>
          </div>
          <div class="story-stream" id="story-stream" aria-busy="true"></div>
        </aside>
      </section>

      <noscript>
        <div class="state-panel">
          <p class="state-eyebrow">JavaScript required</p>
          <h2>This edition is printed from a daily JSON file.</h2>
          <p>Enable JavaScript to read and filter the current stories.</p>
        </div>
      </noscript>
    </main>

    <footer class="colophon page-width">
      <p>The Daily Signal</p>
      <p>bitcoin / ai / robotics / longevity</p>
      <p>no engagement bait</p>
    </footer>

    <script src="./news-core.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
